<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>نظام الخرائط المحلي</title>

  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Tahoma, Arial, sans-serif; display:flex; background:#f3f4f6; }
    #map { flex:1; height:100vh; }
    .side { width:380px; padding:15px; background:#f3f4f6; border-left:1px solid #ddd; overflow-y:auto; height:100vh; }
    .card { background:#fff; border:1px solid #ddd; border-radius:14px; padding:14px; margin-bottom:12px; }
    h2 { margin:0 0 10px; color:#16325c; }
    input[type="file"], input[type="text"], input[type="password"] {
      width:100%; padding:10px; margin-bottom:10px;
      border:1px solid #ccc; border-radius:10px; font-size:16px;
    }
    button { width:100%; padding:12px; background:#2563eb; color:#fff; border:0; border-radius:10px; font-size:18px; cursor:pointer; margin-bottom:6px; }
    button:hover { background:#1d4ed8; }
    button.secondary { background:#6b7280; font-size:14px; padding:8px; }
    button.secondary:hover { background:#4b5563; }
    button.danger { background:#dc2626; font-size:13px; padding:5px 10px; width:auto; margin:0; }
    button.danger:hover { background:#b91c1c; }
    .status { margin-top:8px; font-size:15px; }
    .result-item { background:#f9fafb; border:1px solid #ddd; border-radius:10px; padding:10px; margin-bottom:8px; cursor:pointer; }
    .result-item:hover { background:#eef4ff; }
    .file-item { background:#f9fafb; border:1px solid #ddd; border-radius:10px; padding:10px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .file-item-info { flex:1; cursor:pointer; }
    .file-item-info:hover { color:#2563eb; }
    .muted { color:#666; font-size:13px; }
    .count { color:#16325c; font-weight:bold; margin-bottom:8px; font-size:15px; }

    /* اللوجن */
    #loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.65); z-index:9999; display:flex; align-items:center; justify-content:center; }
    #loginBox { background:#fff; border-radius:18px; padding:32px 28px; width:340px; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,0.3); }
    #loginBox h2 { color:#16325c; font-size:22px; margin-bottom:20px; }
    #loginBox input { width:100%; padding:11px; margin-bottom:12px; border:1px solid #ccc; border-radius:10px; font-size:16px; }
    #loginBox button { width:100%; padding:13px; background:#2563eb; color:#fff; border:0; border-radius:10px; font-size:18px; cursor:pointer; }
    #loginBox button:hover { background:#1d4ed8; }
    #loginError { color:#b91c1c; font-size:14px; margin-top:8px; min-height:20px; }

    /* شريط المستخدم */
    .user-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; background:#fff; border-radius:12px; padding:10px 14px; border:1px solid #ddd; }
    .user-bar span { font-size:14px; color:#444; }
    .role-badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:bold; }
    .role-admin { background:#dbeafe; color:#1d4ed8; }
    .role-viewer { background:#d1fae5; color:#065f46; }
    .user-bar button { width:auto; padding:6px 14px; font-size:13px; margin:0; }

    /* البحث */
    .search-tabs { display:flex; gap:6px; margin-bottom:10px; }
    .tab-btn { flex:1; padding:7px; font-size:13px; border:1px solid #ccc; border-radius:8px; background:#f9fafb; cursor:pointer; color:#333; }
    .tab-btn.active { background:#2563eb; color:#fff; border-color:#2563eb; }
    /* البحث الجغرافي المتطور */
    .geo-search-wrap { position:relative; }
    .geo-results { border:1px solid #d1d5db; border-radius:12px; background:#fff; max-height:260px; overflow-y:auto; margin-bottom:8px; display:none; box-shadow:0 6px 20px rgba(0,0,0,0.12); }
    .geo-item { padding:10px 13px; cursor:pointer; font-size:14px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; gap:8px; }
    .geo-item:last-child { border-bottom:none; }
    .geo-item:hover { background:#eff6ff; }
    .geo-item.highlighted { background:#eff6ff; }
    .geo-item-icon { font-size:16px; flex-shrink:0; }
    .geo-item-body { flex:1; min-width:0; }
    .geo-item-name { font-weight:600; color:#1e3a5f; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .geo-item-sub { font-size:12px; color:#6b7280; margin-top:1px; }

    .geo-coords-hint { font-size:11px; color:#6b7280; margin-bottom:8px; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:6px 10px; line-height:1.6; }

<div id="loginOverlay">
  <div id="loginBox">
    <h2>🗺️ نظام الخرائط</h2>
    <input type="text" id="loginUser" placeholder="اسم المستخدم" />
    <input type="password" id="loginPass" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter') doLogin()" />
    <button onclick="doLogin()">دخول</button>
    <div id="loginError"></div>
  </div>
</div>

<div class="side">

  <div class="user-bar" id="userBar" style="display:none;">
    <span>👤 <b id="userNameLabel"></b> &nbsp;<span class="role-badge" id="roleBadge"></span></span>
    <button class="secondary" onclick="logout()">خروج</button>
  </div>

  <div class="card" id="uploadCard" style="display:none;">
    <h2>رفع KMZ</h2>
    <input type="file" id="file" accept=".kmz">
    <button onclick="upload()">رفع الملف</button>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h2>البحث</h2>
    <div class="search-tabs">
      <button class="tab-btn active" id="tab-features" onclick="switchTab('features')">🔍 داخل الملفات</button>
      <button class="tab-btn" id="tab-geo" onclick="switchTab('geo')">🌍 بحث جغرافي</button>
    </div>

    <div id="panel-features">
      <input type="text" id="searchBox" placeholder="ابحث بأي اسم أو قيمة..." oninput="searchFeatures()" />
      <div id="searchCount" class="count"></div>
      <div id="results"><div class="muted">لا توجد نتائج حالياً</div></div>
    </div>

    <div id="panel-geo" style="display:none;">

      <!-- خانة البحث -->
      <div class="geo-input-wrap">
        <span class="geo-input-icon">🔍</span>
        <input type="text" id="geoSearchBox"
          placeholder="اسم منطقة أو إحداثيات..."
          oninput="geoSearchDebounced()"
          onkeydown="geoKeyNav(event)"
          autocomplete="off" />
      </div>
      <div class="geo-coords-hint">
        💡 <b>يقبل عدة صيغ:</b><br>
        • اسم حي: <code>الطشاش</code> أو <code>العشار</code><br>
        • DD: <code>32.5003, 45.8289</code><br>
        • DMS: <code>32°30'01"N 45°49'44"E</code><br>
        • بدون رموز: <code>32 30 01 N 45 49 44 E</code>

      <div class="geo-results" id="geoResults"></div>
      <div class="muted" id="geoStatus"></div>
    </div>
  </div>

<div id="map"></div>

<script>
// ===== اللوجن =====
let currentRole = null;
let currentUser = '';

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  document.getElementById('loginError').textContent = '';
  if (!username || !password) { document.getElementById('loginError').textContent = 'أدخل اليوزر والباسورد'; return; }
  try {
    const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password}) });
    const data = await res.json();
    if (data.success) {
      currentRole = data.role; currentUser = username;
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('userBar').style.display = 'flex';
      document.getElementById('userNameLabel').textContent = username;
      const badge = document.getElementById('roleBadge');
      if (currentRole === 'admin') {
        badge.textContent = 'مدير'; badge.className = 'role-badge role-admin';
        document.getElementById('uploadCard').style.display = 'block';
      } else {
        badge.textContent = 'مشاهد'; badge.className = 'role-badge role-viewer';
      }
      loadFiles();
    } else {
      document.getElementById('loginError').textContent = data.error || 'خطأ في تسجيل الدخول';
    }
  } catch(e) { document.getElementById('loginError').textContent = 'تعذر الاتصال بالسيرفر'; }
}

function logout() {
  currentRole = null; currentUser = '';
  document.getElementById('uploadCard').style.display = 'none';
  document.getElementById('userBar').style.display = 'none';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginOverlay').style.display = 'flex';
}

// ===== الخريطة =====
const map = L.map('map').setView([33.3, 44.3], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(map);

let currentMarkersLayer = null;
let currentShapesLayer = null;
let searchableFeatures = [];
let searchMarker = null; // مؤشر البحث المتحرك

// مؤشر متحرك (نبضة)
const pulseIcon = L.divIcon({
  className: '',
  html: '<div class="locating-pulse"></div>',
  iconSize: [20, 20],
  iconAnchor: [10, 10]
});

function setSearchMarker(latlng, popupText) {
  if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
  searchMarker = L.marker(latlng, { icon: pulseIcon, zIndexOffset: 1000 })
    .addTo(map)
    .bindPopup(`<b>${popupText}</b>`)
    .openPopup();
}

function setStatus(msg, type='') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = type === 'error' ? '#b91c1c' : '#166534';
}

function featureToHtml(feature) {
  const props = feature.properties || {};
  let html = '<div style="max-width:260px">';
  for (let k in props) { if (props[k] !== null && props[k] !== '') html += `<b>${k}</b>: ${props[k]}<br>`; }
  return html + '</div>';
}

function clearMapLayers() {
  if (currentMarkersLayer) { map.removeLayer(currentMarkersLayer); currentMarkersLayer = null; }
  if (currentShapesLayer) { map.removeLayer(currentShapesLayer); currentShapesLayer = null; }
}

function buildSearchIndex(features, pointLayerRefs) {
  searchableFeatures = features.map((feature, i) => {
    const props = feature.properties || {};
    const text = Object.values(props).filter(Boolean).join(' ').toLowerCase();
    return { feature, marker: pointLayerRefs[i] || null, searchText: text };
  });
}

function showGeoJSON(data) {
  clearMapLayers();
  const pointRefs = [];
  const cluster = L.markerClusterGroup({ chunkedLoading:true, chunkDelay:50 });
  const shapes = L.geoJSON(null, {
    style:{weight:2},
    onEachFeature:(f,l) => l.bindPopup(featureToHtml(f))
  }).addTo(map);

  const geo = L.geoJSON(data, {
    pointToLayer:(feature,latlng) => {
      const marker = L.marker(latlng);
      marker.bindPopup(featureToHtml(feature));
      pointRefs.push(marker);
      cluster.addLayer(marker);
      return marker;
    },
    onEachFeature:(feature,layer) => {
      if (!(layer instanceof L.Marker)) {
        layer.bindPopup(featureToHtml(feature));
        shapes.addLayer(layer);
      }
    }
  });

  map.addLayer(cluster);
  currentMarkersLayer = cluster;
  currentShapesLayer = shapes;
  buildSearchIndex(data.features || [], pointRefs);
  try { map.fitBounds(geo.getBounds(), {padding:[20,20]}); } catch(e){}
  renderResults([]);
  document.getElementById('searchCount').textContent = '';
}

function zoomToFeature(item) {
  const props = item.feature.properties || {};
  const label = Object.values(props).find(v=>v) || 'نتيجة';
  if (item.marker) {
    const latlng = item.marker.getLatLng();
    map.setView(latlng, 17);
    setSearchMarker(latlng, label);
  } else {
    try {
      const bounds = L.geoJSON(item.feature).getBounds();
      map.fitBounds(bounds, {padding:[30,30]});
      setSearchMarker(bounds.getCenter(), label);
    } catch(e){}
  }
}

function renderResults(items) {
  const box = document.getElementById('results');
  box.innerHTML = '';
  if (!items.length) { box.innerHTML = '<div class="muted">لا توجد نتائج حالياً</div>'; return; }
  items.forEach(item => {
    const props = item.feature.properties || {};
    const title = Object.values(props).find(v=>v) || 'نتيجة بدون اسم';
    const div = document.createElement('div');
    div.className = 'result-item';
    div.innerHTML = `<div><b>${title}</b></div><div class="muted">${Object.entries(props).slice(0,3).map(([k,v])=>`${k}: ${v}`).join(' | ')}</div>`;
    div.onclick = () => zoomToFeature(item);
    box.appendChild(div);
  });
}

function searchFeatures() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const countEl = document.getElementById('searchCount');
  if (!q) { countEl.textContent=''; renderResults([]); return; }
  const results = searchableFeatures.filter(item => item.searchText.includes(q)).slice(0,100);
  countEl.textContent = `عدد النتائج: ${results.length}`;
  renderResults(results);
}

// --- الحالة ---
let geoFilter = 'all';        // 'all' | 'wasit' | 'basra'

let geoHighlight = -1;        // للتنقل بالكيبورد
let geoDebounceTimer = null;
let lastGeoItems = [];        // قائمة النتائج الحالية للكيبورد

// --- فلترة المحافظة ---
function setGeoFilter(f) {
  geoFilter = f;
  ['all','wasit','basra'].forEach(k => {
    document.getElementById('gf-'+k).classList.toggle('active', k === f);
  });
  doGeoSearch();
}

// --- تاريخ البحث ---


// --- تنقل بالكيبورد ---
function geoKeyNav(e) {
  const box = document.getElementById('geoResults');
  const items = box.querySelectorAll('.geo-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    geoHighlight = Math.min(geoHighlight+1, items.length-1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    geoHighlight = Math.max(geoHighlight-1, 0);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (geoHighlight >= 0 && items[geoHighlight]) items[geoHighlight].click();
    return;
  } else if (e.key === 'Escape') {
    box.style.display = 'none'; return;
  } else { return; }
  items.forEach((el,i) => el.classList.toggle('highlighted', i===geoHighlight));
  if (items[geoHighlight]) items[geoHighlight].scrollIntoView({block:'nearest'});
}

// --- بحث محلي ---
function searchLocal(q) {
  const qn = q.trim().toLowerCase().replace(/^(حي|منطقة|ناحية|مدينة)\s+/,'');
  return LOCAL_PLACES.filter(p => {
    const pn = p.name.toLowerCase().replace(/^(حي|منطقة|مدينة)\s+/,'');
    return pn.includes(qn) || qn.includes(pn) || p.name.toLowerCase().includes(qn);
  });
}

// --- الدالة الرئيسية ---
function geoSearchDebounced() {
  clearTimeout(geoDebounceTimer);
  geoHighlight = -1;
  // نتائج فورية من القاموس بدون تأخير
  const q = document.getElementById('geoSearchBox').value.trim();
  if (q.length >= 2) showLocalResults(q);
  // ثم Nominatim بعد 400ms
  geoDebounceTimer = setTimeout(() => doGeoSearch(true), 400);
}

// ===== محلل الإحداثيات - يدعم كل الصيغ =====
function parseCoords(q) {
  const s = q.trim().replace(/‏|‎/g, ''); // إزالة RLM/LRM

  // 1. DD عادي: 32.5003, 45.8289 أو 32.5003 45.8289
  let m = s.replace(/[()]/g,'').match(/^(-?\d+\.?\d*)\s*[,،;\s]\s*(-?\d+\.?\d*)$/);
  if (m) {
    const a = parseFloat(m[1]), b = parseFloat(m[2]);
    if (a >= -90 && a <= 90 && b >= -180 && b <= 180) return {lat:a, lon:b};
  }

  // 2. DMS كامل مع رموز: 32°30'01"N 45°49'44"E أو N32°30'01" E45°49'44"
  const dmsRe = /(\d+)[°d]\s*(\d+)['′m]\s*([\d.]+)["″s]?\s*([NSns])[,\s]*(\d+)[°d]\s*(\d+)['′m]\s*([\d.]+)["″s]?\s*([EWew])/i;
  m = s.match(dmsRe);
  if (m) {
    let lat = parseFloat(m[1]) + parseFloat(m[2])/60 + parseFloat(m[3])/3600;
    let lon = parseFloat(m[5]) + parseFloat(m[6])/60 + parseFloat(m[7])/3600;
    if (/[Ss]/i.test(m[4])) lat = -lat;
    if (/[Ww]/i.test(m[8])) lon = -lon;
    return {lat, lon};
  }

  // 3. DMS بدون رموز: 32 30 01 N 45 49 44 E
  const dmsPlain = /(\d+)\s+(\d+)\s+([\d.]+)\s*([NSns])\s+(\d+)\s+(\d+)\s*([\d.]+)\s*([EWew])/i;
  m = s.match(dmsPlain);
  if (m) {
    let lat = parseFloat(m[1]) + parseFloat(m[2])/60 + parseFloat(m[3])/3600;
    let lon = parseFloat(m[5]) + parseFloat(m[6])/60 + parseFloat(m[7])/3600;
    if (/[Ss]/i.test(m[4])) lat = -lat;
    if (/[Ww]/i.test(m[8])) lon = -lon;
    return {lat, lon};
  }

  // 4. DDM: 32°30.016'N 45°49.733'E
  const ddmRe = /(\d+)[°d]\s*([\d.]+)['′m]\s*([NSns])[,\s]*(\d+)[°d]\s*([\d.]+)['′m]\s*([EWew])/i;
  m = s.match(ddmRe);
  if (m) {
    let lat = parseFloat(m[1]) + parseFloat(m[2])/60;
    let lon = parseFloat(m[4]) + parseFloat(m[5])/60;
    if (/[Ss]/i.test(m[3])) lat = -lat;
    if (/[Ww]/i.test(m[6])) lon = -lon;
    return {lat, lon};
  }

  // 5. صيغة Google Maps النسخ: 32.5003°N 45.8289°E
  const googleRe = /(-?[\d.]+)[°]?\s*([NSns])[,\s]+(-?[\d.]+)[°]?\s*([EWew])/i;
  m = s.match(googleRe);
  if (m) {
    let lat = parseFloat(m[1]);
    let lon = parseFloat(m[3]);
    if (/[Ss]/i.test(m[2])) lat = -lat;
    if (/[Ww]/i.test(m[4])) lon = -lon;
    return {lat, lon};
  }

  return null;
}

function formatDMS(lat, lon) {
  function toDMS(val, pos, neg) {
    const d = Math.abs(val);
    const deg = Math.floor(d);
    const minF = (d - deg) * 60;
    const min = Math.floor(minF);
    const sec = ((minF - min) * 60).toFixed(1);
    return `${deg}°${min}'${sec}"${val >= 0 ? pos : neg}`;
  }
  return `${toDMS(lat,'N','S')} ${toDMS(lon,'E','W')}`;
}

function showLocalResults(q) {
  const resultsBox = document.getElementById('geoResults');

  // كشف إحداثيات أولاً
  const coords = parseCoords(q);
  if (coords) {
    renderResults([{
      type:'coord',
      name: `${coords.lat.toFixed(6)}, ${coords.lon.toFixed(6)}`,
      sub: formatDMS(coords.lat, coords.lon),
      lat: coords.lat, lon: coords.lon
    }]);
    return;
  }

  const local = searchLocal(q);
  if (local.length) {
    renderResults(local.map(p => ({type:'local', name:p.name, sub:p.city+' — '+p.prov, lat:p.lat, lon:p.lon, prov:p.prov})));
  }
}

async function doGeoSearch(skipLocal=false) {
  const q = document.getElementById('geoSearchBox').value.trim();
  const resultsBox = document.getElementById('geoResults');
  const status = document.getElementById('geoStatus');
  if (q.length < 2) { resultsBox.style.display='none'; status.textContent=''; return; }

  // كشف إحداثيات (يدعم DD, DMS, DDM, Google Maps)
  const coords = parseCoords(q);
  if (coords) {
    const {lat, lon} = coords;
    map.setView([lat, lon], 16);
    setSearchMarker([lat, lon], `${lat.toFixed(5)}, ${lon.toFixed(5)}`);
    const label = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
    document.getElementById('geoSearchBox').value = label;
    status.textContent = `📍 ${formatDMS(lat, lon)}`;
    resultsBox.style.display = 'none';
    return;
  }

  const localResults = searchLocal(q);

  // Nominatim
  let nominatimResults = [];
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+' العراق')}&format=json&limit=10&accept-language=ar,en&countrycodes=iq`;
    const res = await fetch(url, {headers:{'Accept-Language':'ar,en'}});
    const data = await res.json();
    nominatimResults = data.filter(item => {
      const lat = parseFloat(item.lat), lon = parseFloat(item.lon);
      return lat >= 29 && lat <= 34 && lon >= 44 && lon <= 49;
    });
  } catch(e) {}

  status.textContent = '';

  if (!localResults.length && !nominatimResults.length) {
    status.textContent = '⚠️ لم يتم العثور على نتائج';
    resultsBox.style.display = 'none';
    return;
  }

  const combined = [
    ...localResults.map(p => ({type:'local', name:p.name, sub:p.city+' — '+p.prov, lat:p.lat, lon:p.lon, prov:p.prov})),
    ...nominatimResults.map(item => {
      const parts = item.display_name.split(',').map(s=>s.trim());
      return {type:'nominatim', name:parts[0], sub:parts[1]||'', lat:parseFloat(item.lat), lon:parseFloat(item.lon), bbox:item.boundingbox};
    })
  ];
  renderResults(combined);
}

function renderResults(items) {
  lastGeoItems = items;
  geoHighlight = -1;
  const resultsBox = document.getElementById('geoResults');
  resultsBox.innerHTML = '';
  if (!items.length) { resultsBox.style.display='none'; return; }

  let prevType = null;
  items.forEach((item, idx) => {
    // فاصل بين المحلي والنومينيتم
    if (prevType === 'local' && item.type === 'nominatim') {
      const sep = document.createElement('div');
      sep.className = 'geo-sep';
      sep.textContent = '── نتائج إضافية ──';
      resultsBox.appendChild(sep);
    }
    prevType = item.type;

    const div = document.createElement('div');
    div.className = 'geo-item';

    const icon = item.type === 'coord' ? '🎯' : item.type === 'local' ? '📍' : '🔍';
    const tag  = item.type === 'local' ? `<span class="geo-item-tag">${item.prov||''}</span>` : '';

    div.innerHTML = `
      <span class="geo-item-icon">${icon}</span>
      <div class="geo-item-body">
        <div class="geo-item-name">${item.name}</div>
        ${item.sub ? `<div class="geo-item-sub">${item.sub}</div>` : ''}
      </div>
      ${tag}`;

    div.onclick = () => {
      if (item.bbox && item.type === 'nominatim') {
        const bb = item.bbox.map(parseFloat);
        map.fitBounds([[bb[0],bb[2]],[bb[1],bb[3]]], {padding:[30,30]});
      } else {
        map.setView([item.lat, item.lon], 15);
      }
      setSearchMarker([item.lat, item.lon], item.name);
      document.getElementById('geoSearchBox').value = item.name;
      document.getElementById('geoResults').style.display = 'none';
      document.getElementById('geoStatus').textContent = '';
    };
    resultsBox.appendChild(div);
  });
  resultsBox.style.display = 'block';
}



// ===== التبويبات =====
function switchTab(tab) {
  document.getElementById('tab-features').classList.toggle('active', tab==='features');
  document.getElementById('tab-geo').classList.toggle('active', tab==='geo');
  document.getElementById('panel-features').style.display = tab==='features' ? 'block' : 'none';
  document.getElementById('panel-geo').style.display = tab==='geo' ? 'block' : 'none';
}

// ===== الرفع =====
async function upload() {
  const file = document.getElementById('file').files[0];
  if (!file) return setStatus('اختر ملف','error');
  const fd = new FormData();
  fd.append('file', file);
  setStatus('جاري الرفع...');
  try {
    const res = await fetch('/api/upload', {method:'POST', body:fd});
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'فشل الرفع');
    const geo = await fetch('/api/data/'+json.file);
    const data = await geo.json();
    showGeoJSON(data);
    setStatus('تم بنجاح ✅');
    loadFiles();
  } catch(e) { setStatus(e.message||'فشل الرفع','error'); }
}

// ===== حذف ملف =====
async function deleteFile(savedFile, originalName, e) {
  e.stopPropagation();
  if (!confirm(`هل تريد حذف الملف؟\n${originalName}`)) return;
  try {
    const res = await fetch('/api/files/' + savedFile, {method:'DELETE'});
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'فشل الحذف');
    loadFiles();
  } catch(e) { alert('فشل الحذف: ' + e.message); }
}

// ===== قائمة الملفات =====
async function loadFiles() {
  try {
    const res = await fetch('/api/files');
    const files = await res.json();
    const box = document.getElementById('filesList');
    box.innerHTML = '';
    if (!Array.isArray(files) || !files.length) { box.innerHTML='<div class="muted">لا توجد ملفات بعد</div>'; return; }
    files.forEach(file => {
      const div = document.createElement('div');
      div.className = 'file-item';

      const info = document.createElement('div');
      info.className = 'file-item-info';
      info.innerHTML = `<div><b>${file.originalName || file.savedFile}</b></div><div class="muted">العناصر: ${file.featureCount||0}</div>`;
      info.onclick = async () => {
        try {
          const geo = await fetch('/api/data/'+file.savedFile);
          const data = await geo.json();
          showGeoJSON(data);
        } catch(e) {}
      };
      div.appendChild(info);

      // زر الحذف للادمن فقط
      if (currentRole === 'admin') {
        const btn = document.createElement('button');
        btn.className = 'danger';
        btn.textContent = '🗑️';
        btn.title = 'حذف الملف';
        btn.onclick = (e) => deleteFile(file.savedFile, file.originalName || file.savedFile, e);
        div.appendChild(btn);
      }

      box.appendChild(div);
    });
  } catch { document.getElementById('filesList').innerHTML='<div class="muted">تعذر تحميل القائمة</div>'; }
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('#panel-geo')) document.getElementById('geoResults').style.display='none';
});
