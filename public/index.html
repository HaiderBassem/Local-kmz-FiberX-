<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<title>نظام الخرائط</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Tahoma,Arial,sans-serif;display:flex;height:100vh;width:100vw;overflow:hidden;background:#f3f4f6;}
#map{position:absolute;top:0;left:0;bottom:0;right:320px;z-index:1;}
.side{position:absolute;top:0;right:0;width:320px;height:100vh;background:#f3f4f6;border-left:1px solid #ddd;overflow-y:auto;z-index:100;padding:8px;}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;margin-bottom:8px;}
h2{color:#16325c;font-size:15px;margin-bottom:8px;}
h3{color:#374151;font-size:13px;margin-bottom:6px;}
input[type=text],input[type=password],input[type=file],select{
  width:100%;padding:8px 10px;margin-bottom:6px;border:1px solid #ccc;
  border-radius:8px;font-size:13px;outline:none;font-family:inherit;}
input:focus,select:focus{border-color:#2563eb;}
button{width:100%;padding:9px;background:#2563eb;color:#fff;border:0;
  border-radius:8px;font-size:14px;cursor:pointer;margin-bottom:5px;font-family:inherit;}
button:hover{background:#1d4ed8;}
button.sec{background:#6b7280;font-size:12px;padding:7px;}
button.sec:hover{background:#4b5563;}
button.grn{background:#16a34a;}button.grn:hover{background:#15803d;}
button.red{background:#dc2626;}button.red:hover{background:#b91c1c;}
button.org{background:#d97706;}button.org:hover{background:#b45309;}
button.sm{width:auto;padding:5px 10px;font-size:12px;margin:0;}

/* البحث */
.tabs{display:flex;gap:5px;margin-bottom:8px;}
.tab{flex:1;padding:6px;font-size:12px;border:1px solid #ccc;border-radius:7px;
  background:#f9fafb;cursor:pointer;color:#333;width:auto;}
.tab.on{background:#2563eb;color:#fff;border-color:#2563eb;}
.sw{position:relative;margin-bottom:5px;}
.sw input{padding-right:30px;margin:0;}
.si{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#999;font-size:15px;pointer-events:none;}
.geo-results{border:1px solid #ddd;border-radius:8px;background:#fff;max-height:260px;
  overflow-y:auto;margin-bottom:5px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.geo-item{padding:9px 10px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px;}
.geo-item:last-child{border-bottom:none;}
.geo-item:hover{background:#eef4ff;}
.geo-st{font-size:11px;color:#888;min-height:14px;margin-bottom:3px;}
.ri{background:#f9fafb;border:1px solid #ddd;border-radius:8px;padding:8px;margin-bottom:5px;cursor:pointer;font-size:13px;}
.ri:hover{background:#eef4ff;}
.cnt{color:#16325c;font-weight:bold;font-size:12px;margin-bottom:5px;}
.muted{color:#777;font-size:12px;}

/* الطبقات */
#layerFilter{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px;}
.lbtn{padding:3px 8px;font-size:11px;border-radius:5px;border:1px solid #ccc;
  background:#f9fafb;cursor:pointer;color:#333;width:auto;}
.lbtn.on{background:#2563eb;color:#fff;border-color:#2563eb;}
.lst{font-size:11px;color:#888;}

/* الملفات */
.fi{background:#f9fafb;border:1px solid #ddd;border-radius:8px;padding:9px;
  margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.fi-info{cursor:pointer;flex:1;}
.fi-info:hover .fi-name{color:#2563eb;}
.fi-name{font-weight:bold;font-size:13px;color:#111;}
.fi-sub{font-size:11px;color:#888;margin-top:2px;}
.fi-del{background:#dc2626;color:#fff;border:none;padding:4px 8px;border-radius:6px;
  cursor:pointer;font-size:11px;width:auto;margin:0;flex-shrink:0;}
.fi-del:hover{background:#b91c1c;}

/* الإدارة */
.ar{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
.ar input,.ar select{flex:1;width:auto;min-width:0;margin:0;padding:7px 8px;font-size:12px;}
.ar button{width:auto;margin:0;padding:6px 10px;font-size:12px;}
#userTable{width:100%;border-collapse:collapse;font-size:12px;}
#userTable th{background:#f3f4f6;padding:6px;text-align:right;font-weight:600;}
#userTable td{padding:6px;border-bottom:1px solid #f0f0f0;}
.rb{padding:2px 7px;border-radius:8px;font-size:10px;font-weight:600;}
.ra{background:#dbeafe;color:#1d4ed8;}.ru{background:#d1fae5;color:#065f46;}
.amsg{font-size:12px;margin-top:4px;min-height:15px;}

/* لوجن */
#lo{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;
  display:flex;align-items:center;justify-content:center;}
#lb{background:#fff;border-radius:14px;padding:28px 22px;width:300px;
  text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3);}
#lb h2{color:#16325c;font-size:19px;margin-bottom:14px;}
#le{color:#b91c1c;font-size:12px;margin-top:5px;min-height:16px;}
</style>
</head>
<body>

<!-- لوجن -->
<div id="lo">
  <div id="lb">
    <h2>🗺️ نظام الخرائط</h2>
    <input type="text" id="lu" placeholder="اسم المستخدم"/>
    <input type="password" id="lp" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button onclick="doLogin()">دخول</button>
    <div id="le"></div>
  </div>
</div>

<div id="map"></div>

<div class="side">

  <!-- أدمن: رفع KMZ -->
  <div class="card" id="uploadCard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h2 style="margin:0">📂 رفع KMZ</h2>
      <button onclick="toggleAdmin()" class="sm" style="background:#16325c">⚙️ أكاونتات</button>
    </div>
    <input type="file" id="fileInput" accept=".kmz"/>
    <button class="grn" onclick="upload()">رفع الملف</button>
    <button class="sec" onclick="logout()">تسجيل خروج</button>
    <div id="upStatus" style="font-size:12px;margin-top:4px;color:#166534;"></div>
  </div>

  <!-- يوزر عادي: شريط علوي -->
  <div class="card" id="userBar" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span id="uname" style="font-size:13px;color:#16325c;font-weight:bold"></span>
      <button class="sec sm" onclick="logout()">خروج</button>
    </div>
  </div>

  <!-- لوحة الإدارة -->
  <div class="card" id="adminCard" style="display:none">
    <h2>⚙️ إدارة الأكاونتات</h2>

    <h3>➕ إضافة مستخدم</h3>
    <div class="ar">
      <input type="text" id="nUser" placeholder="اليوزر" autocomplete="off"/>
      <input type="password" id="nPass" placeholder="الباسورد" autocomplete="off"/>
    </div>
    <div class="ar">
      <select id="nRole"><option value="user">مستخدم عادي</option><option value="admin">مشرف</option></select>
      <button class="grn sm" onclick="addUser()">➕ إضافة</button>
    </div>
    <div class="amsg" id="addMsg"></div>

    <hr style="margin:10px 0;border-color:#eee"/>
    <h3>👥 المستخدمون</h3>
    <table id="userTable">
      <thead><tr><th>المستخدم</th><th>الصلاحية</th><th>إجراءات</th></tr></thead>
      <tbody id="uBody"><tr><td colspan="3" style="color:#999;text-align:center;padding:8px">جاري التحميل...</td></tr></tbody>
    </table>

    <hr style="margin:10px 0;border-color:#eee"/>
    <h3>🔑 تغيير كلمة مرور</h3>
    <div class="ar">
      <input type="text" id="cpU" placeholder="اليوزر" autocomplete="off"/>
      <input type="password" id="cpP" placeholder="الباسورد الجديد" autocomplete="off"/>
      <button class="org sm" onclick="changePass()">تغيير</button>
    </div>
    <div class="amsg" id="cpMsg"></div>
  </div>

  <!-- البحث -->
  <div class="card">
    <h2>🔍 البحث</h2>
    <div class="tabs">
      <button class="tab on" id="tGeo" onclick="switchTab('geo')">🌍 جغرافي</button>
      <button class="tab" id="tFeat" onclick="switchTab('feat')">📄 داخل الملفات</button>
    </div>

    <div id="pGeo">
      <div class="sw">
        <span class="si">🔍</span>
        <input type="text" id="geoBox" placeholder="منطقة، مستشفى، مطعم، حي..." oninput="geoDelay()" autocomplete="off" style="padding-right:28px"/>
      </div>
      <div class="geo-st" id="geoSt"></div>
      <div class="geo-results" id="geoRes"></div>
    </div>

    <div id="pFeat" style="display:none">
      <input type="text" id="featBox" placeholder="ابحث بأي اسم أو قيمة..." oninput="searchFeat()"/>
      <div id="featCnt" class="cnt"></div>
      <div id="featRes"><div class="muted">لا توجد نتائج</div></div>
    </div>
  </div>

  <!-- الطبقات -->
  <div class="card" id="filterCard" style="display:none">
    <h2>🔧 الطبقات</h2>
    <div id="layerFilter"></div>
    <div class="lst" id="layerSt"></div>
  </div>

  <!-- الملفات -->
  <div class="card">
    <h2>📁 الملفات المرفوعة</h2>
    <div id="filesList"><div class="muted">لا توجد ملفات</div></div>
  </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script>
// ===== المتغيرات العامة =====
let isAdmin = false;
let _creds  = { username:'', password:'' };
let PLACES  = [];
let allLayers = {};
let searchable = [];

// ===== الخريطة =====
const map = L.map('map').setView([31.0,47.0],8);
const baseMaps = {
  '🗺️ Google Maps':     L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=ar',{subdomains:'0123',maxZoom:22,attribution:'© Google'}),
  '🛰️ Google Hybrid':   L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}&hl=ar',{subdomains:'0123',maxZoom:22,attribution:'© Google'}),
  '📡 Google Satellite': L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{subdomains:'0123',maxZoom:22,attribution:'© Google'}),
  '🔵 OpenStreetMap':    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}),
};
baseMaps['🗺️ Google Maps'].addTo(map);
L.control.layers(baseMaps,{},{position:'topright',collapsed:false}).addTo(map);

// ===== تحميل الأماكن =====
fetch('/api/places').then(r=>r.json()).then(d=>{
  PLACES = d;
  console.log('Places loaded:',d.length);
}).catch(()=>{});

// ===== اللوجن =====
async function doLogin(){
  const u=document.getElementById('lu').value.trim();
  const p=document.getElementById('lp').value;
  document.getElementById('le').textContent='';
  if(!u||!p){document.getElementById('le').textContent='أدخل اليوزر والباسورد';return;}
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await res.json();
    if(d.success){
      _creds={username:u,password:p};
      document.getElementById('lo').style.display='none';
      if(d.role==='admin'){
        isAdmin=true;
        document.getElementById('uploadCard').style.display='block';
      } else {
        document.getElementById('userBar').style.display='block';
        document.getElementById('uname').textContent='👤 '+u;
      }
      loadFiles();
    } else {
      document.getElementById('le').textContent=d.error||'خطأ';
    }
  }catch(e){document.getElementById('le').textContent='تعذر الاتصال';}
}

function logout(){
  isAdmin=false; _creds={username:'',password:''};
  ['uploadCard','userBar','adminCard','filterCard'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('lu').value='';
  document.getElementById('lp').value='';
  document.getElementById('lo').style.display='flex';
  document.getElementById('filesList').innerHTML='<div class="muted">لا توجد ملفات</div>';
  clearAllLayers();
}

// ===== إدارة الأكاونتات =====
function toggleAdmin(){
  const c=document.getElementById('adminCard');
  const show=c.style.display==='none';
  c.style.display=show?'block':'none';
  if(show) loadUsers();
}

async function loadUsers(){
  try{
    const res=await fetch('/api/users/list',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(_creds)});
    const data=await res.json();
    const tb=document.getElementById('uBody');
    if(!Array.isArray(data)){tb.innerHTML='<tr><td colspan="3" style="color:red">خطأ</td></tr>';return;}
    tb.innerHTML=data.map(u=>`<tr>
      <td><b>${u.username}</b></td>
      <td><span class="rb ${u.role==='admin'?'ra':'ru'}">${u.role==='admin'?'مشرف':'مستخدم'}</span></td>
      <td>${u.username!==_creds.username?`<button class="red sm fi-del" onclick="delUser('${u.username}')">حذف</button>`:'<span style="color:#999;font-size:11px">أنت</span>'}</td>
    </tr>`).join('');
  }catch(e){document.getElementById('uBody').innerHTML='<tr><td colspan="3" style="color:red">تعذر التحميل</td></tr>';}
}

async function addUser(){
  const u=document.getElementById('nUser').value.trim();
  const p=document.getElementById('nPass').value;
  const r=document.getElementById('nRole').value;
  const msg=document.getElementById('addMsg');
  if(!u||!p){msg.style.color='#dc2626';msg.textContent='أدخل اليوزر والباسورد';return;}
  try{
    const res=await fetch('/api/users/add',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({..._creds,newUser:u,newPass:p,newRole:r})});
    const d=await res.json();
    if(d.success){
      msg.style.color='#16a34a';msg.textContent='✅ تم الإضافة';
      document.getElementById('nUser').value='';
      document.getElementById('nPass').value='';
      loadUsers();
    } else {msg.style.color='#dc2626';msg.textContent=d.error||'خطأ';}
  }catch(e){msg.style.color='#dc2626';msg.textContent='تعذر الاتصال';}
}

async function delUser(target){
  if(!confirm(`حذف المستخدم "${target}"؟`))return;
  try{
    const res=await fetch('/api/users/delete',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({..._creds,targetUser:target})});
    const d=await res.json();
    if(d.success) loadUsers();
    else alert(d.error||'خطأ');
  }catch(e){alert('تعذر الاتصال');}
}

async function changePass(){
  const u=document.getElementById('cpU').value.trim();
  const p=document.getElementById('cpP').value;
  const msg=document.getElementById('cpMsg');
  if(!u||!p){msg.style.color='#dc2626';msg.textContent='أدخل اليوزر والباسورد الجديد';return;}
  try{
    const res=await fetch('/api/users/changepass',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({..._creds,targetUser:u,newPass:p})});
    const d=await res.json();
    if(d.success){
      msg.style.color='#16a34a';msg.textContent='✅ تم التغيير';
      document.getElementById('cpU').value='';
      document.getElementById('cpP').value='';
    } else {msg.style.color='#dc2626';msg.textContent=d.error||'خطأ';}
  }catch(e){msg.style.color='#dc2626';msg.textContent='تعذر الاتصال';}
}

// ===== رسم الطبقات =====
function isFAT(f){
  const p=f.properties||{};
  // 1. المثلث الكبير = FAT (من server.js)
  if(p._isTriangle) return true;
  // 2. اسم الفولدر fat
  const folder=(p._folder||'').toLowerCase();
  if(/^fat[s]?$/i.test(folder.trim())) return true;
  // 3. خصائص FAT
  if(p.FAT_LABEL||p['FAT #']||p.Stracture) return true;
  return false;
}

function isTriangle(f){
  return !!(f.properties && f.properties._isTriangle);
}
function propsHtml(f){
  const p=f.properties||{};
  let h='<div style="max-width:260px;font-size:12px">';
  for(let k in p){if(!k.startsWith('_')&&p[k]!==null&&p[k]!=='')h+=`<b>${k}</b>: ${p[k]}<br>`;}
  return h+'</div>';
}
function clearAllLayers(){
  Object.values(allLayers).forEach(l=>{if(l.cluster)map.removeLayer(l.cluster);if(l.shapes)map.removeLayer(l.shapes);});
  allLayers={};searchable=[];
  document.getElementById('layerFilter').innerHTML='';
  document.getElementById('filterCard').style.display='none';
}

function showGeoJSON(data){
  clearAllLayers();
  const feats=data.features||[];
  const fatPts=[],otherPts=[],polys=[],lines=[];
  feats.forEach(f=>{
    const t=f.geometry&&f.geometry.type;if(!t)return;
    if(t==='Point'||t==='MultiPoint'){isFAT(f)?fatPts.push(f):otherPts.push(f);}
    else if(t.includes('Polygon'))polys.push(f);
    else if(t.includes('Line'))lines.push(f);
  });

  function addPts(arr,col,key,label,fat){
    if(!arr.length)return;
    const cl=L.markerClusterGroup({chunkedLoading:true,chunkDelay:50});
    const refs=[];
    arr.forEach(f=>{
      const ll=[f.geometry.coordinates[1],f.geometry.coordinates[0]];
      const m=(fat||isTriangle(f))
        ? (isTriangle(f)
            // رسم مثلث SVG
            ? L.marker(ll, {icon: L.divIcon({
                html: `<svg width="20" height="18" viewBox="0 0 20 18" style="filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))">
                  <polygon points="10,1 19,17 1,17" fill="${col}" stroke="white" stroke-width="1.5"/>
                </svg>`,
                className:'',
                iconSize:[20,18],
                iconAnchor:[10,17]
              })})
            : L.circleMarker(ll,{radius:6,fillColor:col,color:'#fff',weight:1,fillOpacity:.95})
          )
        : L.marker(ll);
      m.bindPopup(propsHtml(f));cl.addLayer(m);refs.push(m);
    });
    cl.addTo(map);
    allLayers[key]={cluster:cl,shapes:null,features:arr,visible:true,isFAT:fat,label,refs};
    arr.forEach((f,i)=>searchable.push({feature:f,marker:refs[i],txt:Object.values(f.properties||{}).filter(Boolean).join(' ').toLowerCase()}));
  }

  addPts(fatPts,'#f97316','fat','📡 FAT',true);
  addPts(otherPts,'#2563eb','pts','📍 نقاط أخرى',false);

  if(polys.length){
    const s=L.geoJSON({type:'FeatureCollection',features:polys},{style:{color:'#2563eb',weight:2,fillOpacity:.15},onEachFeature:(f,l)=>l.bindPopup(propsHtml(f))}).addTo(map);
    allLayers['poly']={cluster:null,shapes:s,features:polys,visible:true,isFAT:false,label:'⬡ مضلعات'};
    polys.forEach(f=>searchable.push({feature:f,marker:null,txt:Object.values(f.properties||{}).filter(Boolean).join(' ').toLowerCase()}));
  }
  if(lines.length){
    const s=L.geoJSON({type:'FeatureCollection',features:lines},{style:{color:'#7c3aed',weight:2},onEachFeature:(f,l)=>l.bindPopup(propsHtml(f))}).addTo(map);
    allLayers['line']={cluster:null,shapes:s,features:lines,visible:true,isFAT:false,label:'〰 خطوط'};
    lines.forEach(f=>searchable.push({feature:f,marker:null,txt:Object.values(f.properties||{}).filter(Boolean).join(' ').toLowerCase()}));
  }

  renderLayers();
  try{map.fitBounds(L.geoJSON(data).getBounds(),{padding:[20,20]});}catch(e){}
}

function renderLayers(){
  const box=document.getElementById('layerFilter');box.innerHTML='';
  document.getElementById('filterCard').style.display='block';

  [['📡 FAT فقط',()=>{Object.keys(allLayers).forEach(k=>setVis(k,allLayers[k].isFAT));renderLayers();}],
   ['🗺️ الكل',()=>{Object.keys(allLayers).forEach(k=>setVis(k,true));renderLayers();}]
  ].forEach(([txt,fn])=>{
    const b=document.createElement('button');b.className='lbtn';b.textContent=txt;b.onclick=fn;box.appendChild(b);
  });

  Object.keys(allLayers).forEach(k=>{
    const l=allLayers[k];
    const b=document.createElement('button');
    b.className='lbtn'+(l.visible?' on':'');
    b.textContent=`${l.label} (${l.features.length})`;
    b.onclick=()=>{setVis(k,!l.visible);renderLayers();};
    box.appendChild(b);
  });

  const total=Object.values(allLayers).reduce((s,l)=>s+l.features.length,0);
  const fat=Object.values(allLayers).filter(l=>l.isFAT).reduce((s,l)=>s+l.features.length,0);
  document.getElementById('layerSt').textContent=`إجمالي: ${total.toLocaleString()} | FAT: ${fat.toLocaleString()}`;
}

function setVis(k,show){
  const l=allLayers[k];if(!l)return;l.visible=show;
  if(show){if(l.cluster)l.cluster.addTo(map);if(l.shapes)l.shapes.addTo(map);}
  else{if(l.cluster)map.removeLayer(l.cluster);if(l.shapes)map.removeLayer(l.shapes);}
}

// ===== رفع ملف =====
async function upload(){
  const f=document.getElementById('fileInput').files[0];
  const st=document.getElementById('upStatus');
  if(!f){st.style.color='#dc2626';st.textContent='اختر ملف';return;}
  const fd=new FormData();fd.append('file',f);
  st.style.color='#166534';st.textContent='جاري الرفع...';
  try{
    const res=await fetch('/api/upload',{method:'POST',body:fd});
    const d=await res.json();
    if(!res.ok)throw new Error(d.error||'فشل');
    const geo=await fetch('/api/data/'+d.file);
    showGeoJSON(await geo.json());
    st.textContent='✅ تم بنجاح';
    loadFiles();
  }catch(e){st.style.color='#dc2626';st.textContent=e.message||'فشل الرفع';}
}

// ===== قائمة الملفات =====
async function loadFiles(){
  try{
    const files=await fetch('/api/files').then(r=>r.json());
    const box=document.getElementById('filesList');box.innerHTML='';
    if(!Array.isArray(files)||!files.length){box.innerHTML='<div class="muted">لا توجد ملفات</div>';return;}
    files.forEach(f=>{
      const div=document.createElement('div');div.className='fi';
      div.innerHTML=`
        <div class="fi-info" onclick="loadFile('${f.savedFile}')">
          <div class="fi-name">${f.originalName||f.savedFile}</div>
          <div class="fi-sub">العناصر: ${(f.featureCount||0).toLocaleString()}</div>
        </div>
        ${isAdmin?`<button class="fi-del" onclick="delFile('${f.savedFile}',this)">🗑️</button>`:''}`;
      box.appendChild(div);
    });
  }catch(e){document.getElementById('filesList').innerHTML='<div class="muted">تعذر التحميل</div>';}
}

async function loadFile(savedFile){
  try{
    const geo=await fetch('/api/data/'+savedFile);
    showGeoJSON(await geo.json());
  }catch(e){alert('فشل التحميل');}
}

async function delFile(savedFile, btn){
  if(!confirm('حذف هذا الملف؟'))return;
  try{
    const res=await fetch('/api/data/'+savedFile,{method:'DELETE'});
    const d=await res.json();
    if(d.success){clearAllLayers();loadFiles();}
    else alert(d.error||'فشل الحذف');
  }catch(e){alert('تعذر الاتصال');}
}

    };

function geoDelay() {
  clearTimeout(geoTimer);
  geoTimer = setTimeout(doGeoSearch, 300);
}

};

function getTypeInfo(types) {
  const arr = Array.isArray(types) ? types : [types||''];
  for (const t of arr) {
    if (typeAr[t]) {
      const parts = typeAr[t].split(' ');
      return { icon:parts[0], label:parts.slice(1).join(' ') };
    }
  }
  return { icon:'📍', label:'موقع' };
}

function isPlusCode(q) {
  // Plus Code مثل: 892H+VR2 أو 892H+VR2 Baghdad
  return /^[23456789CFGHJMPQRVWX]{4,8}\+[23456789CFGHJMPQRVWX]{2,3}/i.test(q.trim());
}

function isCoords(q) {
  return /(-?\d+[.,]\d*)\s*[,،\s]+\s*(-?\d+[.,]\d*)/.test(q);
}

function zoomToPlace(lat, lon, name, label, address) {
  if (lastMarker) map.removeLayer(lastMarker);
  map.setView([lat, lon], 17);
  const popup = `<b>${name}</b>${label?'<br><small>'+label+'</small>':''}
    ${address?'<br><small style="color:#888">'+address+'</small>':''}
    <br><small style="color:#aaa;font-size:10px">📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}</small>`;
  lastMarker = L.marker([lat,lon]).addTo(map).bindPopup(popup).openPopup();
  setTimeout(()=>{if(lastMarker){map.removeLayer(lastMarker);lastMarker=null;}},20000);
}

function makeResultItem(icon, name, sublabel, lat, lon, address, badge, badgeColor) {
  const div = document.createElement('div');
  div.className = 'geo-item';
  div.innerHTML = `
    <div style="display:flex;align-items:flex-start;gap:10px">

      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>
        <div style="font-size:11px;color:#888;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px;align-items:center">
          ${badge?`<span style="background:${badgeColor||'#555'};color:#fff;padding:1px 7px;border-radius:8px">${badge}</span>`:''}
          ${sublabel?`<span>${sublabel}</span>`:''}
          ${address?`<span style="color:#aaa">· ${address}</span>`:''}
          <span style="color:#ddd;font-size:10px">${lat.toFixed(5)}, ${lon.toFixed(5)}</span>
        </div>
      </div>
    </div>`;
  div.onclick = () => {

    document.getElementById('geoRes').style.display='none';

async function doGeoSearch() {
  const q = document.getElementById('geoBox').value.trim();
  const box = document.getElementById('geoRes');
  const st  = document.getElementById('geoSt');
  if (!q) { box.style.display='none'; st.textContent=''; return; }
  box.innerHTML='';

  // ===== إحداثيات - كل الصيغ =====
  function parseDMS(str) {
    // صيغة DMS: 32°30'15"N 45°48'30"E أو N32°30'15" E45°48'30"
    // أو: 32 30 15 N 45 48 30 E
    const dms = str.trim();
    
    // نمط: N 47°46'51.6"E"29.1'30°32 أو أي تنسيق DMS
    const dmsPattern = /([NS]?\s*\d+[°º]\s*\d+['′]\s*[\d.]+["″]?\s*[NS]?)\s*[,\s]+\s*([EW]?\s*\d+[°º]\s*\d+['′]\s*[\d.]+["″]?\s*[EW]?)/i;
    const m = dms.match(dmsPattern);
    if (m) {
      function dmsToDD(part) {
        const nums = part.match(/[\d.]+/g);
        if (!nums || nums.length < 3) return null;
        const d = parseFloat(nums[0]);
        const min = parseFloat(nums[1]);
        const sec = parseFloat(nums[2]);
        const dd = d + min/60 + sec/3600;
        const neg = /[SW]/i.test(part);
        return neg ? -dd : dd;
      }
      const lat = dmsToDD(m[1]);
      const lon = dmsToDD(m[2]);
      if (lat !== null && lon !== null) return { lat, lon };
    }
    
    // نمط بسيط: 32°30'N 45°48'E
    const simple = str.match(/(\d+)[°º](\d+)['′]?([NS]?)\s*[,\s]+\s*(\d+)[°º](\d+)['′]?([EW]?)/i);
    if (simple) {
      let lat = parseInt(simple[1]) + parseInt(simple[2])/60;
      let lon = parseInt(simple[4]) + parseInt(simple[5])/60;
      if (/S/i.test(simple[3])) lat = -lat;
      if (/W/i.test(simple[6])) lon = -lon;
      return { lat, lon };
    }
    
    return null;
  }

  // تجربة DMS أولاً
  const dmsResult = parseDMS(q);
  if (dmsResult) {
    const { lat, lon } = dmsResult;
    if (lat>=-90&&lat<=90&&lon>=-180&&lon<=180) {
      map.setView([lat,lon],17);
      if(lastMarker) map.removeLayer(lastMarker);
      lastMarker = L.marker([lat,lon]).addTo(map)
        .bindPopup(`<b>📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}</b>`).openPopup();
      box.style.display='none'; st.textContent=''; return;
    }
  }

  // إحداثيات عشرية عادية: 32.123, 45.456
  const cm = q.match(/(-?\d+[.,]\d*)\s*[,،\s]+\s*(-?\d+[.,]\d*)/);
  if (cm) {
    const lat=parseFloat(cm[1].replace(',','.')), lon=parseFloat(cm[2].replace(',','.'));
    if (lat>=-90&&lat<=90&&lon>=-180&&lon<=180) {
      map.setView([lat,lon],17);
      if(lastMarker) map.removeLayer(lastMarker);
      lastMarker = L.marker([lat,lon]).addTo(map)
        .bindPopup(`<b>📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}</b>`).openPopup();
      box.style.display='none'; st.textContent=''; return;
    }
  }

  if (q.length < 2) return;
  st.textContent = '🔍 جاري البحث...';

  const center = map.getCenter();
  const lat0 = center.lat.toFixed(4);
  const lon0 = center.lng.toFixed(4);

  // ===== Plus Code أو بحث بالعنوان = Geocoding API =====
  const useGeocode = isPlusCode(q) || q.includes('+') || q.match(/^\d{4,6},/);

  // ===== 1. بحث محلي فوري =====
  const ql = q.toLowerCase().trim();
  const tOrd={city:0,town:1,suburb:2,neighbourhood:3,quarter:4,sublocality:4,
    hospital:5,university:5,school:6,mosque:6,pharmacy:6,bank:6,hamlet:7,village:8,locality:9};
  const localHits = PLACES
    .filter(p=>p.sk&&p.sk.includes(ql))
    .sort((a,b)=>{
      const aE=a.sk===ql?-1:a.sk.startsWith(ql)?0:1;
      const bE=b.sk===ql?-1:b.sk.startsWith(ql)?0:1;
      return (aE-bE)||((tOrd[a.type]??10)-(tOrd[b.type]??10));
    }).slice(0,4);

  localHits.forEach(p=>{
    const {icon,label} = getTypeInfo([p.type]);
    const gc = p.gov==='البصرة'?'#f97316':'#22d3ee';
    box.appendChild(makeResultItem(icon, p.name, label, p.lat, p.lon,
      p.name_en||'', p.gov, gc));
  });
  if (localHits.length>0) box.style.display='block';

  // ===== 2. Google Geocoding (Plus Codes والعناوين الدقيقة) =====
  try {
    const geoRes = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
    const geoData = await geoRes.json();
    const geoResults = (geoData.results||[]).filter(r=>{
      const loc = r.geometry&&r.geometry.location;
      return loc && loc.lat>=29&&loc.lat<=38&&loc.lng>=38&&loc.lng<=49;
    });

    if (geoResults.length > 0) {
      if (localHits.length>0 || box.children.length>0) {
        const sep=document.createElement('div');
        sep.style.cssText='padding:3px 12px;font-size:10px;color:#bbb;background:#f5f5f5;border-top:1px solid #eee;text-align:center;';
        sep.textContent='── موقع دقيق ──';
        box.appendChild(sep);
      }
      const geocodeSeen = new Set(localHits.map(p=>p.name));
      geoResults.slice(0,3).forEach(r=>{
        const loc=r.geometry.location;
        const name = r.address_components?.[0]?.long_name || r.formatted_address.split('،')[0];
        if (geocodeSeen.has(name)) return;
        geocodeSeen.add(name);
        const addr=(r.formatted_address||'').replace(/,\s*Iraq$/i,'').replace(/،\s*العراق$/,'');
        box.appendChild(makeResultItem('📍', name, 'موقع', loc.lat, loc.lng, addr, 'G', '#4285f4'));
      });
      box.style.display='block';
    }

    // ===== 3. Google Places Text Search =====
    if (!useGeocode || geoResults.length===0) {
      const placesRes = await fetch(`/api/google-places?q=${encodeURIComponent(q)}&lat=${lat0}&lon=${lon0}`);
      const placesData = await placesRes.json();
      const placesResults = (placesData.results||[]);

      const allSeen = new Set([...localHits.map(p=>p.name), ...geoResults.map(r=>r.address_components?.[0]?.long_name||'')]);
      const newPlaces = placesResults.filter(r=>r.name&&r.geometry&&!allSeen.has(r.name));

      if (newPlaces.length>0) {
        const sep=document.createElement('div');
        sep.style.cssText='padding:3px 12px;font-size:10px;color:#bbb;background:#f5f5f5;border-top:1px solid #eee;text-align:center;';
        sep.textContent='── Google Maps ──';
        box.appendChild(sep);

        newPlaces.slice(0,8).forEach(place=>{
          const loc=place.geometry.location;
          const {icon,label}=getTypeInfo(place.types||[]);
          const addr=(place.formatted_address||'')
            .replace(/,?\s*Iraq$/i,'').replace(/،?\s*العراق$/,'')
            .split('،').slice(0,2).join('،').trim();
          const rating=place.rating?`⭐${place.rating}`:'';
          box.appendChild(makeResultItem(
            icon, place.name, label+(rating?' '+rating:''),
            loc.lat, loc.lng, addr, 'G', '#4285f4'
          ));
        });
        box.style.display='block';
      }
    }

    const total = box.querySelectorAll('.geo-item').length;
    st.textContent = total>0 ? '' : '❌ لم يتم العثور على نتائج';

  } catch(e) {
    console.error('Search error:', e);
    if (localHits.length>0) { box.style.display='block'; st.textContent=''; }
    else st.textContent='⚠️ تعذر البحث';
  }
}
